# Cloudflare Worker serving this folder as a static site.
# The name must match the Worker's name in the Cloudflare dashboard. It keeps "concept" in the web
# address, so the link cannot pass for the company's own site.
name = "white-meadow-lake-fire-concept"
compatibility_date = "2026-11-24"
workers_dev = true

[assets]
directory = "./"
not_found_handling = "404-page"
